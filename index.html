<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>My GitHub Pages Website</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">✓</div>
    <p class="eyebrow">GITHUB PAGES TEST</p>
    <h1>It works! 🎉</h1>
    <p class="description">
      Your website is loading HTML, CSS, and JavaScript from GitHub Pages.
    </p>
    <button id="test-button" type="button">Test JavaScript</button>
    <p id="result" class="result" aria-live="polite">JavaScript test has not run yet.</p>
    <p class="tip">Next: replace this sample with your own website.</p>
  </main>
  <footer>Published with GitHub Pages</footer>
</body>
</html>
